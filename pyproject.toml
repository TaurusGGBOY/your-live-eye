[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "your-live-eye"
version = "0.4.1"
description = "Agent-friendly Bilibili live-chat analysis, scheduling and deployment"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "msgpack>=1.0,<2", "tzdata>=2024.1"]
license = "MIT"

[project.urls]
Homepage = "https://your-live-eye-demo.pages.dev/"
Repository = "https://github.com/TaurusGGBOY/your-live-eye"
Issues = "https://github.com/TaurusGGBOY/your-live-eye/issues"

[project.optional-dependencies]
cloud = ["boto3>=1.35,<2"]

[project.scripts]
your-live-eye = "your_live_eye.cli:main"

[tool.setuptools.package-data]
your_live_eye = ["web/*", "prompts/*.txt", "releases.json"]

[tool.setuptools.exclude-package-data]
"*" = ["._*", "**/._*", ".DS_Store"]
